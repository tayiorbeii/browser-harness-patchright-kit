<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- macOS system and UI families -->
  <alias><family>-apple-system</family><accept><family>Inter</family><family>Noto Sans</family></accept></alias>
  <alias><family>BlinkMacSystemFont</family><accept><family>Inter</family><family>Noto Sans</family></accept></alias>
  <alias><family>.AppleSystemUIFont</family><accept><family>Inter</family><family>Noto Sans</family></accept></alias>
  <alias><family>SF Pro</family><accept><family>Inter</family><family>Noto Sans</family></accept></alias>
  <alias><family>SF Pro Display</family><accept><family>Inter</family><family>Noto Sans</family></accept></alias>
  <alias><family>SF Pro Text</family><accept><family>Inter</family><family>Noto Sans</family></accept></alias>
  <alias><family>Helvetica</family><accept><family>Nimbus Sans</family><family>Liberation Sans</family></accept></alias>
  <alias><family>Helvetica Neue</family><accept><family>Nimbus Sans</family><family>Inter</family></accept></alias>
  <alias><family>Lucida Grande</family><accept><family>DejaVu Sans</family><family>Noto Sans</family></accept></alias>
  <alias><family>Avenir</family><accept><family>TeX Gyre Adventor</family><family>Inter</family></accept></alias>
  <alias><family>Avenir Next</family><accept><family>TeX Gyre Adventor</family><family>Inter</family></accept></alias>
  <alias><family>Futura</family><accept><family>TeX Gyre Adventor</family></accept></alias>
  <alias><family>Gill Sans</family><accept><family>Carlito</family><family>Noto Sans</family></accept></alias>
  <alias><family>Geneva</family><accept><family>Liberation Sans</family></accept></alias>
  <alias><family>Menlo</family><accept><family>Fira Code</family><family>DejaVu Sans Mono</family></accept></alias>
  <alias><family>Monaco</family><accept><family>Fira Code</family><family>DejaVu Sans Mono</family></accept></alias>
  <alias><family>New York</family><accept><family>Noto Serif</family><family>Linux Libertine O</family></accept></alias>
  <alias><family>Hoefler Text</family><accept><family>Linux Libertine O</family><family>Noto Serif</family></accept></alias>
  <alias><family>Baskerville</family><accept><family>Linux Libertine O</family><family>Noto Serif</family></accept></alias>
  <alias><family>Didot</family><accept><family>TeX Gyre Termes</family><family>Noto Serif</family></accept></alias>
  <alias><family>Apple Color Emoji</family><accept><family>Noto Color Emoji</family></accept></alias>
  <alias><family>Apple Symbols</family><accept><family>Symbola</family><family>Noto Sans Symbols2</family></accept></alias>

  <!-- Windows system, Office, and classic web-safe families -->
  <alias><family>Segoe UI</family><accept><family>Inter</family><family>Noto Sans</family></accept></alias>
  <alias><family>Segoe UI Variable</family><accept><family>Inter</family><family>Noto Sans</family></accept></alias>
  <alias><family>Segoe UI Emoji</family><accept><family>Noto Color Emoji</family></accept></alias>
  <alias><family>Segoe UI Symbol</family><accept><family>Symbola</family><family>Noto Sans Symbols2</family></accept></alias>
  <alias><family>Arial</family><accept><family>Liberation Sans</family></accept></alias>
  <alias><family>Arial Black</family><accept><family>Nimbus Sans</family><family>Liberation Sans</family></accept></alias>
  <alias><family>Arial Unicode MS</family><accept><family>Noto Sans</family></accept></alias>
  <alias><family>Calibri</family><accept><family>Carlito</family></accept></alias>
  <alias><family>Cambria</family><accept><family>Caladea</family></accept></alias>
  <alias><family>Candara</family><accept><family>Carlito</family><family>Noto Sans</family></accept></alias>
  <alias><family>Comic Sans MS</family><accept><family>Comic Neue</family></accept></alias>
  <alias><family>Consolas</family><accept><family>Fira Code</family><family>DejaVu Sans Mono</family></accept></alias>
  <alias><family>Constantia</family><accept><family>Caladea</family><family>Noto Serif</family></accept></alias>
  <alias><family>Corbel</family><accept><family>Carlito</family><family>Noto Sans</family></accept></alias>
  <alias><family>Courier New</family><accept><family>Liberation Mono</family></accept></alias>
  <alias><family>Franklin Gothic Medium</family><accept><family>Nimbus Sans</family></accept></alias>
  <alias><family>Georgia</family><accept><family>Linux Libertine O</family><family>Noto Serif</family></accept></alias>
  <alias><family>Impact</family><accept><family>Nimbus Sans Narrow</family><family>Liberation Sans</family></accept></alias>
  <alias><family>Lucida Console</family><accept><family>DejaVu Sans Mono</family></accept></alias>
  <alias><family>Lucida Sans Unicode</family><accept><family>DejaVu Sans</family><family>Noto Sans</family></accept></alias>
  <alias><family>Microsoft Sans Serif</family><accept><family>Liberation Sans</family></accept></alias>
  <alias><family>Palatino Linotype</family><accept><family>P052</family><family>TeX Gyre Pagella</family></accept></alias>
  <alias><family>Book Antiqua</family><accept><family>TeX Gyre Pagella</family></accept></alias>
  <alias><family>Century Gothic</family><accept><family>TeX Gyre Adventor</family></accept></alias>
  <alias><family>Garamond</family><accept><family>EB Garamond</family><family>Linux Libertine O</family></accept></alias>
  <alias><family>Tahoma</family><accept><family>Liberation Sans</family><family>Noto Sans</family></accept></alias>
  <alias><family>Times New Roman</family><accept><family>Liberation Serif</family></accept></alias>
  <alias><family>Trebuchet MS</family><accept><family>Carlito</family><family>Noto Sans</family></accept></alias>
  <alias><family>Verdana</family><accept><family>DejaVu Sans</family><family>Noto Sans</family></accept></alias>
  <alias><family>Webdings</family><accept><family>Symbola</family><family>Noto Sans Symbols2</family></accept></alias>
  <alias><family>Wingdings</family><accept><family>Symbola</family><family>Noto Sans Symbols2</family></accept></alias>

  <!-- East Asian Windows and macOS UI families -->
  <alias><family>Microsoft YaHei</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>Microsoft JhengHei</family><accept><family>Noto Sans CJK TC</family></accept></alias>
  <alias><family>Meiryo</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias><family>Yu Gothic</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias><family>MS Gothic</family><accept><family>Noto Sans Mono CJK JP</family><family>Noto Sans CJK JP</family></accept></alias>
  <alias><family>MS Mincho</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias><family>Malgun Gothic</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias><family>PingFang SC</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>PingFang TC</family><accept><family>Noto Sans CJK TC</family></accept></alias>
  <alias><family>Hiragino Sans</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias><family>Hiragino Mincho ProN</family><accept><family>Noto Serif CJK JP</family></accept></alias>

  <!-- Generic families should have broad Unicode and color-emoji coverage. -->
  <alias><family>system-ui</family><prefer><family>Inter</family><family>Noto Sans</family></prefer></alias>
  <alias><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>math</family><prefer><family>FreeSerif</family><family>Noto Sans Math</family></prefer></alias>
</fontconfig>
